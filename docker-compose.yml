services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: inventory
      DB_USER: inventory
      DB_PASS: inventory
      APP_NAME: "Inventory Manager"
    ports:
      - "8080:80"
    volumes:
      # Live-mount source for local development (edits reflect immediately).
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src

volumes:
  db_data:
